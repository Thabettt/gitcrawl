services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gitcrawl
      POSTGRES_PASSWORD: gitcrawl
      POSTGRES_DB: gitcrawl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
